<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>myfaveTT Local</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #18191a;
            color: #e4e6eb;
            width: 320px;
            padding: 16px;
            margin: 0;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            color: #ff3b5c;
        }
        button {
            background-color: #ff3b5c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e0324e;
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #b0b3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h2>myfaveTT Local Audio Backup</h2>
    <p class="status" id="status-text">Ready to backup liked or followed audio tracks.</p>
    <p class="status" id="progress-text">Found: 0 | Downloaded: 0</p>
    <button id="download-likes">Download Liked Audios</button>
    <button id="download-following">Download Following Audios</button>
    <script src="popup.js"></script>
</body>
</html>
